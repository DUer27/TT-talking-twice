<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>现经管回声</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="sidebarToggle" aria-label="展开或收起边栏">☰</button>
        <a class="brand" href="#">
          <span class="brand-mark">CV</span>
          <span class="brand-text">现经管回声</span>
        </a>
      </div>
      <div class="topbar-search">
        <span class="search-icon">⌕</span>
        <input type="search" placeholder="搜索反馈、课程、宿舍、食堂..." />
      </div>
      <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="切换黑夜或白天模式" title="切换黑夜/白天模式">
          <span class="theme-icon" id="themeIcon">🌙</span>
          <span class="theme-label" id="themeLabel">黑夜</span>
        </button>
        <button class="login-btn">登录</button>
      </div>
    </header>

    <div class="main-wrap">
      <aside class="sidebar" id="sidebar">
        <section class="sidebar-section">
          <div class="sidebar-title">导航</div>
          <a class="sidebar-link active" href="#"><span>⌁</span> 最新反馈</a>
          <a class="sidebar-link" href="#"><span>🔥</span> 热门反馈</a>
          <a class="sidebar-link" href="#"><span>✎</span> 我的反馈</a>
          <a class="sidebar-link" href="#"><span>✓</span> 已处理</a>
        </section>
        <section class="sidebar-section">
          <div class="sidebar-title">吐槽板块</div>
          <a class="sidebar-link" href="#"><span class="dot blue"></span> 课程吐槽</a>
          <a class="sidebar-link" href="#"><span class="dot orange"></span> 食堂吐槽</a>
          <a class="sidebar-link" href="#"><span class="dot purple"></span> 宿舍生活</a>
          <a class="sidebar-link" href="#"><span class="dot green"></span> 校园设施</a>
          <a class="sidebar-link" href="#"><span class="dot red"></span> 行政服务</a>
          <a class="sidebar-link" href="#"><span class="dot cyan"></span> 活动社团</a>
        </section>
        <section class="sidebar-section teacher-entry">
          <div class="sidebar-title">管理</div>
          <a class="sidebar-link" href="#"><span>▣</span> 教师后台</a>
          <a class="sidebar-link" href="#"><span>AI</span> 智能总结</a>
        </section>
      </aside>

      <main class="content">
        <section class="hero-notice">
          <div>
            <strong>校园意见反馈社区</strong>
            <span>文明表达真实体验，老师后台会定期汇总并生成改进报告。</span>
          </div>
          <button class="ghost-btn">查看规则</button>
        </section>
        <section class="navigation-container">
          <div class="filters-row">
            <button class="select-chip">类别 ▸</button>
            <button class="select-chip">标签 ▸</button>
            <button class="select-chip muted">本周活跃 ▸</button>
          </div>
          <div class="tabs-and-action">
            <nav class="nav-pills" aria-label="话题导航">
              <a class="active" href="#">最新</a>
              <a href="#">新反馈 <span>32</span></a>
              <a href="#">未读</a>
              <a href="#">热门</a>
              <a href="#">我的帖子</a>
              <a href="#">已处理</a>
              <a href="#">收藏</a>
            </nav>
            <button class="primary-btn">✎ 发布反馈</button>
          </div>
        </section>
        <section class="topic-panel">
          <div class="show-more">查看 6 个新的或更新的反馈</div>
          <table class="topic-list">
            <thead>
              <tr>
                <th class="topic-col">反馈话题</th>
                <th class="posters-col">参与者</th>
                <th>回复</th>
                <th>浏览</th>
                <th>活动</th>
              </tr>
            </thead>
            <tbody id="topicBody"></tbody>
          </table>
        </section>
      </main>
    </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
